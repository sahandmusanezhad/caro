# CARO's edge (docs/PHASE1_SETUP.md), included in nginx's http block.
#
# Only Cloudflare connects. The server's firewall already lets nothing else
# reach 443; this is the second lock, so that the first one's mistake is not
# the site's. A connection from any other address is closed without an
# answer, and the client is the address Cloudflare names in
# CF-Connecting-IP, which only an address of Cloudflare's may set.
#
# Both lists are /etc/caro/nginx/cloudflare-*.conf on the server, written by
# deploy/cloudflare-ips.sh from Cloudflare's published ranges.

include /etc/nginx/caro/cloudflare-realip.conf;
real_ip_header CF-Connecting-IP;

# Whether the connection came from Cloudflare, read from the address that
# made it: after realip, $remote_addr is the client's, so an allow list on it
# would be a list of clients, not of Cloudflare.
geo $realip_remote_addr $caro_from_cloudflare {
    default 0;
    include /etc/nginx/caro/cloudflare-geo.conf;
}

map $host $caro_env {
    caro.noxioai.com          production;
    caro-staging.noxioai.com  staging;
    default                   "";
}

server_tokens off;

# A name the server does not serve gets no certificate at all.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name caro.noxioai.com caro-staging.noxioai.com;

    ssl_certificate     /etc/caro/tls/origin.pem;
    ssl_certificate_key /etc/caro/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker's own resolver, for the names the environments give themselves
    # on caro_edge; a stopped environment is a 502, not a failed start.
    resolver 127.0.0.11 ipv6=off valid=10s;

    client_max_body_size 64k;

    if ($caro_from_cloudflare = 0) {
        return 444;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://api-$caro_env:8000;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://site-$caro_env:3000;
        proxy_read_timeout 30s;
    }
}
