# What a change has to pass before it merges.
#
# Four jobs, run side by side:
#
#   suites    all nineteen suites of tests/run_all.py. The runner exits 0 when
#             a suite is skipped for a missing dependency, and "skipped is not
#             passed" is this project's rule, so this job fails on any skip.
#             Then the alerts' own tests, by promtool (docs/SLO.md).
#   web       the site's type check, lint and production build.
#   e2e       the site and the API side by side, every key route in a
#             browser, at a desk and on a phone, light and dark, and the
#             seller listings from a code to a number shown
#             (webapp/web/e2e/routes.mjs, docs/DESIGN_SYSTEM.md).
#   postgres  the suites that touch a database, once more against a real
#             Postgres: the seller store, the catalog, the contract suite's
#             rows that serve the site from the catalog, and the
#             collection's queue and runs. On the
#             runner they use SQLite in a temporary file, which is what a
#             laptop has; production uses Postgres, and the two differ in
#             exactly the places caro/sql.py exists for.
#
# Nothing here deploys. Vercel builds the site and the API from each push to
# main of Tecso-Dev/caro, until the server takes them over; the server's
# images are images.yml's (docs/PHASE1_SETUP.md).
#
# The actions are on their Node 24 releases, v7 of all three (2026-10-30, the
# owner's choice): v4 and v5 ran on Node 20, which GitHub deprecates and every
# run warned of. What their majors since then changed touches nothing here --
# no fork checkout on pull_request_target, the npm and pip caches named
# explicitly, no pip-install input, Python 3.12.
#
# The jobs are pinned to Ubuntu 24.04, the image `ubuntu-latest` has been.
# GitHub moves that label to Ubuntu 26.04 from 2026-10-19, to be done by
# 2026-11-19, and warns that workflows tied to 24.04 may be affected. Moving
# to 26.04 is a change to make on purpose, in a commit and a run of its own.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/web/package-lock.json

      # scipy builds the oracle in test_appraisal; httpx is what the API's
      # test client needs. node_modules is what the screens suite draws with.
      - name: Install Python packages
        run: pip install numpy scipy httpx -r webapp/requirements.txt

      - name: Install web packages
        run: npm ci --no-audit --no-fund
        working-directory: webapp/web

      - name: Run every suite
        run: |
          python tests/run_all.py | tee run_all.log
          if grep -q "did NOT run" run_all.log; then
            echo "::error::a suite was skipped; skipped is not passed"
            exit 1
          fi

      # Made series in, the alerts that must and must not fire out
      # (deploy/grafana/alerts_test.yml); promtool loads and checks the rules
      # as it goes.
      - name: The alerts' own tests
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/grafana:/g:ro" -w /g \
            prom/prometheus:v3.16.0 test rules alerts_test.yml

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/web/package-lock.json

      - name: Install Python packages
        run: pip install numpy -r webapp/requirements.txt

      - name: The site, built as production builds it
        working-directory: webapp/web
        env:
          CARO_API: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm ci --no-audit --no-fund && npm run build

      # Playwright for this job alone: never one of the site's dependencies,
      # so neither its lock file nor any build of it carries a browser.
      - name: Playwright and its Chromium
        working-directory: webapp/web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      # The seller store in a file of the job's, the fake SMS echoing each code
      # into the API's log for the check to read, and an operator's token made
      # up for the job: the seller listings walked from end to end.
      - name: The API and the site, side by side
        env:
          CARO_INBOX: "off"
          DATABASE_URL: sqlite:///${{ runner.temp }}/store.sqlite3
          CARO_STORE_SECRET: made-up-for-the-e2e-job-0123456789abcdef
          CARO_SMS_PROVIDER: fake
          CARO_SMS_FAKE_ECHO: "1"
          CARO_ADMIN_TOKEN: made-up-for-the-e2e-job-operator
        run: |
          nohup python -m uvicorn webapp.api.main:app --port 8000 > api.log 2>&1 &
          (cd webapp/web && CARO_API=http://127.0.0.1:8000 nohup npx next start -p 3000 > ../../site.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          exit 1

      - name: Every key route, at a desk and on a phone, light and dark, and the seller listings
        working-directory: webapp/web
        env:
          CARO_SITE: http://127.0.0.1:3000
          CARO_API_LOG: ${{ github.workspace }}/api.log
          CARO_E2E_ADMIN_TOKEN: made-up-for-the-e2e-job-operator
        run: node e2e/routes.mjs

      - name: The servers' logs, when that failed
        if: failure()
        run: tail -n 100 api.log site.log

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A database for this job alone, gone with it. Trust instead of a
    # password: nothing outside the job can reach it, and no password is
    # written in the repository.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caro
          POSTGRES_DB: caro
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caro"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PG: postgresql://caro@localhost:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/requirements.txt

      # psycopg is the driver caro/sql.py imports for a Postgres address,
      # and only for one; nothing else needs it.
      - name: Install Python packages
        run: pip install numpy scipy httpx "psycopg[binary]" -r webapp/requirements.txt

      # Each suite refuses a database that already holds its tables, so each
      # gets an empty one. `shared` is the seller store and the catalog in one
      # database, as docs/SERVICES.md allows.
      - name: Empty databases
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["PG"] + "/caro", autocommit=True) as c:
              for db in ("store", "catalog", "api_catalog", "shared", "queue", "runs"):
                  c.execute(f"CREATE DATABASE {db}")
          PY

      - name: The seller store on Postgres
        run: python tests/test_store.py
        env:
          CARO_TEST_STORE_URL: ${{ env.PG }}/store

      - name: The catalog on Postgres
        run: python tests/test_catalog.py
        env:
          CARO_TEST_CATALOG_URL: ${{ env.PG }}/catalog

      - name: The site served from a Postgres catalog
        run: python tests/test_api_contract.py
        env:
          CARO_TEST_API_CATALOG_URL: ${{ env.PG }}/api_catalog

      # Two workers racing for one job is FOR UPDATE SKIP LOCKED's to settle,
      # and only a real Postgres has it.
      - name: The collection's queue and runs on Postgres
        run: python tests/test_collection.py
        env:
          CARO_TEST_QUEUE_URL: ${{ env.PG }}/queue
          CARO_TEST_RUNS_URL: ${{ env.PG }}/runs

      - name: The seller store and the catalog in one database
        run: |
          CARO_TEST_STORE_URL=$PG/shared python tests/test_store.py
          CARO_TEST_CATALOG_URL=$PG/shared python tests/test_catalog.py
